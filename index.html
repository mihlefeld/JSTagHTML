<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TagHTML - WCA Competition Nametag Editor</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Ace Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.0/ace.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>TagHTML Nametag Editor</h1>
        </header>

        <div class="container">
            <!-- Left Panel: Template Editor -->
             
        <div class="panel editor-panel">
            <div class="template-controls" aria-labelledby="template-controls-title">
                <h2 id="template-controls-title" class="sr-only">Template settings</h2>

                <div class="control-row">
                    <label for="templates-select" class="control-label">Template</label>
                    <select name="templates" id="templates-select" aria-describedby="template-help">
                        <option value="/JSTagHTML/templates/personal-schedule.html.jinja">Personal Schedules</option>
                        <option value="/JSTagHTML/templates/event-overview.html.jinja">Event Overview</option>
                    </select>
                </div>
                <p id="template-help" class="help-text">
                    Choose a template, then optionally load local files for use in custom templates.
                </p>

                <div class="template-assets-controls" role="group" aria-labelledby="template-assets-label" aria-describedby="files-help files-status">
                    <p id="template-assets-label" class="control-label">Local template assets</p>

                    <div class="asset-actions">
                        <label for="template-files-input" class="sr-only">Upload local files</label>
                        <input type="file" id="template-files-input" multiple />
                        <button id="clear-files-button" type="button">Clear files</button>
                    </div>

                    <p id="files-help" class="help-text">
                        Files are loaded locally in your browser and are not uploaded.
                    </p>
                    <span id="files-status" class="status-message" role="status" aria-live="polite">No files loaded</span>
                </div>
            </div>

            <div id="editor" class="editor-container"></div>
            <div class="editor-controls">
                <button id="reset-template-button">Reset to Default</button>
                <button id="save-session-button">Save Session</button>
                <button id="render-button">Render</button>
            </div>
        </div>

            <!-- Right Panel: Live Preview -->
            <div class="panel preview-panel">
                <h2>Preview</h2>
                <div id="preview-controls" class="preview-controls">
                    <input 
                        type="text" 
                        id="competition-id" 
                        placeholder="Competition ID"
                        class="competition-input-compact"
                    >
                    <button id="fetch-button">Fetch</button>
                    <span id="fetch-status" class="status-message"></span>
                    <span id="preview-status" class="status-message"></span>
                    <button id="print-button">Print / Export PDF</button>
                </div>
                <iframe id="preview" class="preview-container">
                    <p class="placeholder">Enter competition ID above and edit the template to see the preview here.</p>
                </iframe>
            </div>
        </div>

    </div>
    <!-- Nunjucks (Jinja2-compatible templating) -->
    <script src="https://cdn.jsdelivr.net/npm/nunjucks@3.2.3/browser/nunjucks.min.js"></script>
    
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
